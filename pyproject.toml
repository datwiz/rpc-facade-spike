[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "something"
version = "0.1.0"
description = "Call a function without caring whether it runs here or on Lambda."
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
# A mixed project: hand-written Python in python/, the native module built
# from crates/py and dropped in beside it as something._something.
manifest-path = "crates/py/Cargo.toml"
python-source = "python"
module-name = "something._something"
